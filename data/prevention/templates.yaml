# The words the Due screen shows beside each row, in both languages. Information only: each sentence
# says what the guideline lists, never what the person ought to do.
version: "prevention-templates 0.2.0"
why:
  every_n_months:
    en: "The guideline lists it every {months} months between ages {from} and {to}."
    es: "La guía lo incluye cada {months} meses entre los {from} y los {to} años."
    de: "Die Leitlinie führt ihn alle {months} Monate im Alter von {from} bis {to} Jahren auf."
    fr: "La recommandation la prévoit tous les {months} mois entre {from} et {to} ans."
  every_n_months_open:
    en: "The guideline lists it every {months} months from age {from}."
    es: "La guía lo incluye cada {months} meses a partir de los {from} años."
    de: "Die Leitlinie führt ihn alle {months} Monate ab {from} Jahren auf."
    fr: "La recommandation la prévoit tous les {months} mois à partir de {from} ans."
  once:
    en: "The guideline lists it once between ages {from} and {to}."
    es: "La guía lo incluye una vez entre los {from} y los {to} años."
    de: "Die Leitlinie führt ihn einmal im Alter von {from} bis {to} Jahren auf."
    fr: "La recommandation la prévoit une fois entre {from} et {to} ans."
  once_open:
    en: "The guideline lists it once from age {from}."
    es: "La guía lo incluye una vez a partir de los {from} años."
    de: "Die Leitlinie führt ihn einmal ab {from} Jahren auf."
    fr: "La recommandation la prévoit une fois à partir de {from} ans."
  series:
    en: "The guideline lists {doses} doses from age {from}."
    es: "La guía incluye {doses} dosis a partir de los {from} años."
    de: "Die Leitlinie führt {doses} Dosen ab {from} Jahren auf."
    fr: "La recommandation prévoit {doses} doses à partir de {from} ans."
  seasonal:
    en: "The guideline lists one dose each season from age {from}."
    es: "La guía incluye una dosis cada temporada a partir de los {from} años."
    de: "Die Leitlinie führt eine Dosis pro Saison ab {from} Jahren auf."
    fr: "La recommandation prévoit une dose chaque saison à partir de {from} ans."
reasons:
  no_birth_date:
    en: "The profile has no birth date, so the rows by age cannot be checked."
    es: "El perfil no tiene fecha de nacimiento, así que las filas por edad no se pueden comprobar."
    de: "Das Profil hat kein Geburtsdatum, daher lassen sich die Zeilen nach Alter nicht prüfen."
    fr: "Le profil n'a pas de date de naissance, les lignes par âge ne peuvent donc pas être vérifiées."
  no_answer:
    en: "This row depends on an answer the profile does not hold yet: {question}."
    es: "Esta fila depende de una respuesta que el perfil aún no tiene: {question}."
    de: "Diese Zeile hängt von einer Antwort ab, die das Profil noch nicht enthält: {question}."
    fr: "Cette ligne dépend d'une réponse que le profil n'a pas encore : {question}."
  no_sex:
    en: "The profile has no sex at birth, so this row cannot be checked."
    es: "El perfil no tiene sexo al nacer, así que esta fila no se puede comprobar."
    de: "Das Profil hat kein Geschlecht bei Geburt, daher lässt sich diese Zeile nicht prüfen."
    fr: "Le profil n'a pas de sexe à la naissance, cette ligne ne peut donc pas être vérifiée."
  country_not_covered:
    en: "There is no prevention list for this profile's country yet. Only the lab gaps of the rule pack show."
    es: "Aún no hay lista de prevención para el país de este perfil. Solo se muestran los huecos de analíticas del paquete de reglas."
    de: "Für das Land dieses Profils gibt es noch keine Vorsorgeliste. Es erscheinen nur die Laborlücken des Regelpakets."
    fr: "Il n'y a pas encore de liste de prévention pour le pays de ce profil. Seuls les manques d'analyses du jeu de règles apparaissent."
  no_country:
    en: "The profile has no country, so no prevention list applies yet. Only the lab gaps of the rule pack show."
    es: "El perfil no tiene país, así que aún no se aplica ninguna lista de prevención. Solo se muestran los huecos de analíticas del paquete de reglas."
    de: "Das Profil hat kein Land, daher gilt noch keine Vorsorgeliste. Es erscheinen nur die Laborlücken des Regelpakets."
    fr: "Le profil n'a pas de pays, aucune liste de prévention ne s'applique donc encore. Seuls les manques d'analyses du jeu de règles apparaissent."
# The questions of pack.yaml `answer_keys`, as the Settings card and a not_assessed row show them.
answers:
  smoking_history:
    question:
      en: "A smoking history of 20 pack-years or more, with smoking now or stopped within the last 15 years (one pack a day for one year is one pack-year)"
      es: "Un historial de tabaquismo de 20 paquetes-año o más, con consumo actual o abandonado en los últimos 15 años (un paquete al día durante un año es un paquete-año)"
      de: "Eine Rauchanamnese von 20 Packungsjahren oder mehr, mit Rauchen derzeit oder Aufhören innerhalb der letzten 15 Jahre (eine Packung am Tag über ein Jahr ist ein Packungsjahr)"
      fr: "Un tabagisme de 20 paquets-années ou plus, actuel ou arrêté depuis moins de 15 ans (un paquet par jour pendant un an correspond à un paquet-année)"
  hysterectomy:
    question:
      en: "A hysterectomy that removed the cervix, and no history of cervical cancer or a high-grade precancer"
      es: "Una histerectomía con extirpación del cuello del útero, sin antecedentes de cáncer de cuello de útero ni de lesión precancerosa de alto grado"
      de: "Eine Hysterektomie mit Entfernung des Gebärmutterhalses und ohne Vorgeschichte von Gebärmutterhalskrebs oder einer hochgradigen Krebsvorstufe"
      fr: "Une hystérectomie avec ablation du col de l'utérus, sans antécédent de cancer du col ni de lésion précancéreuse de haut grade"
