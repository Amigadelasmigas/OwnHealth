    records: {en: "Conditions, allergies, medicines, vaccines, procedures, screenings due and family history: not shown, this account cannot read them.", es: "Problemas de salud, alergias, medicamentos, vacunas, procedimientos, cribados pendientes y antecedentes familiares: no se muestran, esta cuenta no puede leerlos.", de: "Erkrankungen, Allergien, Arzneimittel, Impfungen, Eingriffe, fällige Vorsorge und Familienanamnese: nicht gezeigt, dieses Konto kann sie nicht lesen.", fr: "Problèmes de santé, allergies, médicaments, vaccins, actes, dépistages à faire et antécédents familiaux : non affichés, ce compte ne peut pas les lire."}
