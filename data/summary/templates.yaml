# Every word the printed doctor summary and the IPS export (its section titles and narratives) write
# themselves, in English and Spanish. Placeholders in braces are filled by the server ({n}, {date},
# {page}, ...). Information, never advice: the wording lint reads each string, and the PDF's text
# layer is linted again in the tests.
version: "summary-templates 0.3.0"
templates:
  title: {en: Doctor summary, es: Resumen para el médico, de: "Arztzusammenfassung"}
  subtitle: {en: "Data as of {as_of}", es: "Datos a {as_of}", de: "Daten, Stand {as_of}"}
  notice:
    en: "Information from the person's own records, not a diagnosis. Every value names its source (src_…); the sources are listed at the end."
    es: "Información de los registros de la propia persona, no un diagnóstico. Cada valor cita su fuente (src_…); las fuentes se listan al final."
    de: "Informationen aus den eigenen Akten der Person, keine Diagnose. Jeder Wert nennt seine Quelle (src_…); die Quellen stehen am Ende."
  unprintable:
    en: "Characters this sheet cannot print show as ?; the record keeps the original text."
    es: "Los caracteres que esta hoja no puede imprimir aparecen como ?; el registro guarda el texto original."
    de: "Zeichen, die dieses Blatt nicht drucken kann, erscheinen als ?; die Akte behält den Originaltext."
  age: {en: "{n} years", es: "{n} años", de: "{n} Jahre"}
  born: {en: "born {date}", es: "nacimiento {date}", de: "geboren {date}"}
  sec:
    conditions: {en: Active conditions, es: Problemas de salud activos, de: "Aktive Erkrankungen"}
    allergies: {en: Allergies, es: Alergias, de: "Allergien"}
    medications: {en: Medicines and supplements, es: Medicamentos y suplementos, de: "Arzneimittel und Nahrungsergänzungsmittel"}
    genome: {en: Pharmacogenomics and genome findings, es: Farmacogenética y hallazgos genómicos, de: "Pharmakogenomik und Genombefunde"}
    flags: {en: "Flags, by rank", es: "Avisos, por orden de importancia", de: "Hinweise, nach Rang"}
    markers: {en: Lab values, es: Valores de laboratorio, de: "Laborwerte"}
    vaccines: {en: Vaccines, es: Vacunas, de: "Impfungen"}
    procedures: {en: Procedures, es: Procedimientos, de: "Eingriffe"}
    calculators: {en: Calculated values, es: Valores calculados, de: "Berechnete Werte"}
    due: {en: "Screenings, vaccines and lab tests due", es: "Cribados, vacunas y análisis pendientes", de: "Fällige Vorsorge, Impfungen und Labortests"}
    family: {en: Patterns in the family history, es: Patrones en los antecedentes familiares, de: "Muster in der Familienanamnese"}
    sources: {en: Sources, es: Fuentes, de: "Quellen"}
    cites: {en: Guidelines and formulas, es: Guías y fórmulas, de: "Leitlinien und Formeln"}
  col:
    condition: {en: Condition, es: Problema, de: "Erkrankung"}
    since: {en: Since, es: Desde, de: "Seit"}
    src: {en: Source, es: Fuente, de: "Quelle"}
    substance: {en: Substance, es: Sustancia, de: "Substanz"}
    criticality: {en: Criticality, es: Gravedad, de: "Kritikalität"}
    reaction: {en: Reaction, es: Reacción, de: "Reaktion"}
    medicine: {en: Medicine, es: Medicamento, de: "Arzneimittel"}
    schedule: {en: When taken, es: Pauta, de: "Einnahme"}
    prescriber: {en: Prescriber, es: Prescriptor, de: "Verordnet von"}
    finding: {en: Finding, es: Hallazgo, de: "Befund"}
