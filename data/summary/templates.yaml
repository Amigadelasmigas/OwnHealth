    rank: {en: "#", es: "#", de: "#"}
    flag: {en: Flag, es: Aviso, de: "Hinweis"}
    test: {en: Test, es: Prueba, de: "Test"}
    value: {en: Value, es: Valor, de: "Wert"}
    range: {en: Lab range, es: Rango lab., de: "Laborbereich"}
    date: {en: Date, es: Fecha, de: "Datum"}
    status: {en: Status, es: Estado, de: "Status"}
    previous: {en: Previous value, es: Valor anterior, de: "Vorheriger Wert"}
    vaccine: {en: Vaccine, es: Vacuna, de: "Impfstoff"}
    dose: {en: Dose, es: Dosis, de: "Dosis"}
    procedure: {en: Procedure, es: Procedimiento, de: "Eingriff"}
    document: {en: "Document, page and date", es: "Documento, página y fecha", de: "Dokument, Seite und Datum"}
    decision: {en: Recorded decision, es: Decisión registrada, de: "Erfasste Entscheidung"}
    calculation: {en: Calculation, es: Cálculo, de: "Berechnung"}
    result: {en: Result, es: Resultado, de: "Ergebnis"}
    item: {en: "Screening, vaccine or test", es: "Cribado, vacuna o análisis", de: "Vorsorge, Impfung oder Test"}
    due: {en: Due date, es: Fecha prevista, de: "Fälligkeitsdatum"}
    last: {en: Last on record, es: Último registro, de: "Zuletzt erfasst"}
    pattern: {en: Pattern, es: Patrón, de: "Muster"}
    relatives: {en: Relatives, es: Familiares, de: "Angehörige"}
    guideline: {en: Guideline or formula, es: Guía o fórmula, de: "Leitlinie oder Formel"}
    cited_as: {en: Cited as, es: Citada como, de: "Zitiert als"}
  none: {en: None on record., es: Nada registrado., de: "Nichts erfasst."}
  not_measured: {en: not measured, es: no medido, de: "nicht gemessen"}
  more: {en: "And {n} more in the record.", es: "Y {n} más en el registro.", de: "Und {n} weitere in der Akte."}
  supplement: {en: supplement, es: suplemento, de: "Nahrungsergänzungsmittel"}
  never: {en: none on record, es: sin registro, de: "nichts erfasst"}
  # the person's own recorded choice, said as a fact about them (the lint reads a bare "keep" or
  # "stop" as advice)
  decision:
    keep: {en: decided to keep taking it, es: decidió seguir tomándolo, de: "hat entschieden, es weiter einzunehmen"}
    stop: {en: decided to stop it, es: decidió dejarlo, de: "hat entschieden, es abzusetzen"}
    do_not_repurchase: {en: decided not to buy it again, es: decidió no volver a comprarlo, de: "hat entschieden, es nicht erneut zu kaufen"}
  decision_on: {en: "{decision} on {date}", es: "{decision} el {date}", de: "{decision} am {date}"}
  due_status:
    overdue: {en: overdue, es: vencido, de: "überfällig"}
    due: {en: due, es: pendiente, de: "fällig"}
    upcoming: {en: coming up, es: próximo, de: "demnächst"}
  sensitive: {en: "sensitive, printed because it was ticked for this print", es: "sensible, impreso porque se marcó para esta impresión", de: "sensibel, gedruckt, weil es für diesen Ausdruck angekreuzt wurde"}
  withheld:
    labs: {en: "Lab values and calculated values: not shown, this account cannot read them.", es: "Valores de laboratorio y valores calculados: no se muestran, esta cuenta no puede leerlos.", de: "Laborwerte und berechnete Werte: nicht gezeigt, dieses Konto kann sie nicht lesen."}
    records: {en: "Conditions, allergies, medicines, vaccines, procedures, screenings due and family history: not shown, this account cannot read them.", es: "Problemas de salud, alergias, medicamentos, vacunas, procedimientos, cribados pendientes y antecedentes familiares: no se muestran, esta cuenta no puede leerlos.", de: "Erkrankungen, Allergien, Arzneimittel, Impfungen, Eingriffe, fällige Vorsorge und Familienanamnese: nicht gezeigt, dieses Konto kann sie nicht lesen."}
    genome: {en: "Genome findings: not shown, this account cannot read them.", es: "Hallazgos genómicos: no se muestran, esta cuenta no puede leerlos.", de: "Genombefunde: nicht gezeigt, dieses Konto kann sie nicht lesen."}
  criticality:
    high: {en: high, es: alta, de: "hoch"}
    low: {en: low, es: baja, de: "niedrig"}
    unable-to-assess: {en: not assessed, es: sin valorar, de: "nicht beurteilt"}
  kind:
    document_region: {en: document, es: documento, de: "Dokument"}
    fhir_import: {en: FHIR import, es: importación FHIR, de: "FHIR-Import"}
    apple_health: {en: Apple Health, es: Apple Health, de: "Apple Health"}
    genome_facts: {en: genome facts file, es: fichero de hallazgos genómicos, de: "Datei mit Genombefunden"}
    manual: {en: entered by hand, es: introducido a mano, de: "von Hand eingegeben"}
    device: {en: device, es: dispositivo, de: "Gerät"}
    agent_proposal: {en: agent proposal, es: propuesta de un agente, de: "Vorschlag eines Agenten"}
    calculated: {en: calculated, es: calculado, de: "berechnet"}
  footer:
    en: "OwnHealth · {rules} · {summary} · state {hash} · page {page}/{pages}"
    es: "OwnHealth · {rules} · {summary} · estado {hash} · página {page}/{pages}"
    de: "OwnHealth · {rules} · {summary} · Zustand {hash} · Seite {page}/{pages}"
  ips:
    title: {en: International Patient Summary, es: Resumen internacional del paciente, de: "Internationale Patientenkurzakte"}
    # a SMART Health Link: the reader has no account, and these words are the same on every link
    link_withheld: {en: Not included in this link., es: No se incluye en este enlace., de: "In diesem Link nicht enthalten."}
    link_notice:
      en: "This summary holds only what the person chose to share, and never a sensitive category."
      es: "Este resumen contiene solo lo que la persona eligió compartir, y nunca una categoría sensible."
      de: "Diese Zusammenfassung enthält nur, was die Person teilen wollte, und nie eine sensible Kategorie."
