  # the person's own recorded choice, said as a fact about them (the lint reads a bare "keep" or
  # "stop" as advice)
  decision:
    keep: {en: decided to keep taking it, es: decidió seguir tomándolo, de: "hat entschieden, es weiter einzunehmen", fr: "a décidé de continuer à le prendre"}
    stop: {en: decided to stop it, es: decidió dejarlo, de: "hat entschieden, es abzusetzen", fr: "a décidé de l'arrêter"}
    do_not_repurchase: {en: decided not to buy it again, es: decidió no volver a comprarlo, de: "hat entschieden, es nicht erneut zu kaufen", fr: "a décidé de ne pas le racheter"}
