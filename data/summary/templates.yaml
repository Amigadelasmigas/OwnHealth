    es: "OwnHealth · {rules} · {summary} · estado {hash} · página {page}/{pages}"
    de: "OwnHealth · {rules} · {summary} · Zustand {hash} · Seite {page}/{pages}"
    fr: "OwnHealth · {rules} · {summary} · état {hash} · page {page}/{pages}"
