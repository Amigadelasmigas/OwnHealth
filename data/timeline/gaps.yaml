# Document gaps: what the record lacks that a provider holds, and the letter that asks for a copy.
# Loaded through ownhealth-rules::cited (server/crates/ownhealth-rules/src/gaps.rs). Every row and
# every law the letter names carries an https cite; every template has es and en text.
version: "gaps 0.1.0"

rows:
  # A visit with a provider and no document on file from that provider, dated from the visit day to
  # window_days after it. Provider names match with case and accents folded, when the words of the
  # shorter name appear in order in the longer one, other words allowed between them ("Hospital
  # Norte" matches "Traumatología · Hospital Norte" and "Hospital Universitario Norte").
  - id: visit_without_report
    window_days: 30
    source: GDPR Art. 15
    cite: https://eur-lex.europa.eu/eli/reg/2016/679/oj#art_15
  # min_days or more between two dated facts of the record, with nothing dated in between.
  - id: records_hole
    min_days: 365
    source: GDPR Art. 15
    cite: https://eur-lex.europa.eu/eli/reg/2016/679/oj#art_15

templates:
  title:
    visit_without_report:
      en: "Visit {date} ({provider}) has no report on file"
      es: "La visita del {date} ({provider}) no tiene informe archivado"
      de: "Für den Besuch am {date} ({provider}) liegt kein Bericht vor"
      fr: "La consultation du {date} ({provider}) n'a pas de compte rendu dans le dossier"
      ca: "La visita del {date} ({provider}) no té informe arxivat"
      it: "La visita del {date} ({provider}) non ha un referto in archivio"
      pt: "A consulta de {date} ({provider}) não tem relatório arquivado"
    records_hole:
      en: "No records between {from} and {to}"
      es: "Sin registros entre {from} y {to}"
      de: "Keine Einträge zwischen {from} und {to}"
      fr: "Aucun enregistrement entre le {from} et le {to}"
      ca: "Sense registres entre {from} i {to}"
      it: "Nessuna registrazione tra il {from} e il {to}"
      pt: "Sem registos entre {from} e {to}"
  # The Due list shows the gap without the provider's name: its document holds dates and ids only.
  due_title:
    visit_without_report:
      en: "Report of the visit on {date}"
      es: "Informe de la visita del {date}"
      de: "Bericht über den Besuch am {date}"
      fr: "Compte rendu de la consultation du {date}"
      ca: "Informe de la visita del {date}"
      it: "Referto della visita del {date}"
      pt: "Relatório da consulta de {date}"
    records_hole:
      en: "Records from {from} to {to}"
      es: "Registros del {from} al {to}"
      de: "Einträge vom {from} bis {to}"
      fr: "Dossiers du {from} au {to}"
      ca: "Registres del {from} al {to}"
      it: "Registrazioni dal {from} al {to}"
      pt: "Registos de {from} a {to}"
  why:
    visit_without_report:
      en: "No document from the visit's provider is on file in the {days} days after it. The provider keeps a copy that can be requested."
      es: "No hay ningún documento del centro de la visita en los {days} días siguientes. El centro guarda una copia que se puede solicitar."
      de: "In den {days} Tagen nach dem Besuch liegt kein Dokument der besuchten Einrichtung vor. Die Einrichtung bewahrt eine Kopie auf, die sich anfordern lässt."
      fr: "Aucun document de l'établissement de la consultation n'est enregistré dans les {days} jours qui suivent. L'établissement conserve une copie qui peut être demandée."
      ca: "No hi ha cap document del centre de la visita en els {days} dies següents. El centre en guarda una còpia que es pot sol·licitar."
      it: "Nessun documento della struttura della visita è in archivio nei {days} giorni successivi. La struttura conserva una copia che si può richiedere."
      pt: "Não há nenhum documento do prestador da consulta nos {days} dias seguintes. O prestador guarda uma cópia que pode ser pedida."
    records_hole:
      en: "{days} days with nothing dated in the record. Reports from that time may be held elsewhere."
      es: "{days} días sin nada fechado en el historial. Los informes de esa época pueden estar en otro sitio."
      de: "{days} Tage ohne datierte Einträge in der Akte. Berichte aus dieser Zeit liegen vielleicht anderswo."
      fr: "{days} jours sans rien de daté dans le dossier. Des comptes rendus de cette période sont peut-être ailleurs."
      ca: "{days} dies sense res datat a l'historial. Els informes d'aquella època poden ser en un altre lloc."
      it: "{days} giorni senza nulla di datato nella cartella. I referti di quel periodo potrebbero trovarsi altrove."
      pt: "{days} dias sem nada datado no processo. Os relatórios dessa época podem estar noutro sítio."

# The access-request letter, by the profile's country. A country in no list gets the gap with no
# letter, and so does a deceased person's record (the right of access is the living person's own).
# The keys are not language codes: a mapping with `en` or `es` reads as a template.
# The identity document number and the postal address print as blank lines to fill in by
# hand: the app never asks for them, sends them or stores them.
# `basis` is the person's own request; `basis_for` is the request a legal representative makes for
# a minor, whose name prints as a blank line to fill in by hand.
letters:
  spain:
    countries: [ES]
    laws:
      - id: gdpr_art15
        cite: https://eur-lex.europa.eu/eli/reg/2016/679/oj#art_15
        name:
          en: "Regulation (EU) 2016/679 (GDPR), Article 15"
          es: "Reglamento (UE) 2016/679 (RGPD), artículo 15"
          de: "Verordnung (EU) 2016/679 (DSGVO), Artikel 15"
          fr: "Règlement (UE) 2016/679 (RGPD), article 15"
          ca: "Reglament (UE) 2016/679 (RGPD), article 15"
          it: "Regolamento (UE) 2016/679 (GDPR), articolo 15"
          pt: "Regulamento (UE) 2016/679 (RGPD), artigo 15.º"
      - id: gdpr_art12
        cite: https://eur-lex.europa.eu/eli/reg/2016/679/oj#art_12
        name:
          en: "Regulation (EU) 2016/679 (GDPR), Article 12(3)"
          es: "Reglamento (UE) 2016/679 (RGPD), artículo 12.3"
          de: "Verordnung (EU) 2016/679 (DSGVO), Artikel 12 Absatz 3"
          fr: "Règlement (UE) 2016/679 (RGPD), article 12, paragraphe 3"
          ca: "Reglament (UE) 2016/679 (RGPD), article 12.3"
          it: "Regolamento (UE) 2016/679 (GDPR), articolo 12, paragrafo 3"
          pt: "Regulamento (UE) 2016/679 (RGPD), artigo 12.º, n.º 3"
      - id: ley41_art18
        cite: https://www.boe.es/buscar/act.php?id=BOE-A-2002-22188#a18
        name:
          en: "Law 41/2002 of 14 November on patient autonomy (Spain), Article 18"
          es: "Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente, artículo 18"
          de: "Gesetz 41/2002 vom 14. November über die Patientenautonomie (Spanien), Artikel 18"
          fr: "Loi 41/2002 du 14 novembre sur l'autonomie du patient (Espagne), article 18"
          ca: "Llei 41/2002, de 14 de novembre, bàsica reguladora de l'autonomia del pacient, article 18"
          it: "Legge 41/2002 del 14 novembre sull'autonomia del paziente (Spagna), articolo 18"
          pt: "Lei 41/2002, de 14 de novembro, sobre a autonomia do doente (Espanha), artigo 18.º"
    basis:
      en: "Under Article 15 of Regulation (EU) 2016/679 (General Data Protection Regulation) and Article 18 of Spanish Law 41/2002 on patient autonomy, I request a copy of the health data that {provider} holds about my visit on {date}: the report of that visit and the results, images and documents produced in it."
      es: "Al amparo del artículo 15 del Reglamento (UE) 2016/679 (Reglamento General de Protección de Datos) y del artículo 18 de la Ley 41/2002, básica reguladora de la autonomía del paciente, solicito una copia de los datos de salud que {provider} conserva sobre mi visita del {date}: el informe de esa visita y los resultados, imágenes y documentos generados en ella."
      de: "Gemäß Artikel 15 der Verordnung (EU) 2016/679 (Datenschutz-Grundverordnung) und Artikel 18 des spanischen Gesetzes 41/2002 über die Patientenautonomie beantrage ich eine Kopie der Gesundheitsdaten, die {provider} über meinen Besuch am {date} speichert: den Bericht über diesen Besuch sowie die dabei entstandenen Ergebnisse, Bilder und Dokumente."
      fr: "En vertu de l'article 15 du règlement (UE) 2016/679 (règlement général sur la protection des données) et de l'article 18 de la loi espagnole 41/2002 sur l'autonomie du patient, je demande une copie des données de santé que {provider} détient sur ma consultation du {date} : le compte rendu de cette consultation et les résultats, images et documents produits lors de celle-ci."
      ca: "A l'empara de l'article 15 del Reglament (UE) 2016/679 (Reglament general de protecció de dades) i de l'article 18 de la Llei 41/2002, bàsica reguladora de l'autonomia del pacient, sol·licito una còpia de les dades de salut que {provider} conserva sobre la meva visita del {date}: l'informe d'aquella visita i els resultats, imatges i documents que s'hi van generar."
      it: "Ai sensi dell'articolo 15 del Regolamento (UE) 2016/679 (Regolamento generale sulla protezione dei dati) e dell'articolo 18 della legge spagnola 41/2002 sull'autonomia del paziente, chiedo una copia dei dati sanitari che {provider} conserva sulla mia visita del {date}: il referto di quella visita e i risultati, le immagini e i documenti prodotti in essa."
      pt: "Ao abrigo do artigo 15.º do Regulamento (UE) 2016/679 (Regulamento Geral sobre a Proteção de Dados) e do artigo 18.º da Lei espanhola 41/2002 sobre a autonomia do doente, solicito uma cópia dos dados de saúde que {provider} conserva sobre a minha consulta de {date}: o relatório dessa consulta e os resultados, imagens e documentos nela produzidos."
    basis_for:
      en: "Under Article 15 of Regulation (EU) 2016/679 (General Data Protection Regulation) and Article 18 of Spanish Law 41/2002 on patient autonomy, as the legal representative of {name}, I request a copy of the health data that {provider} holds about the visit of {name} on {date}: the report of that visit and the results, images and documents produced in it."
      es: "Al amparo del artículo 15 del Reglamento (UE) 2016/679 (Reglamento General de Protección de Datos) y del artículo 18 de la Ley 41/2002, básica reguladora de la autonomía del paciente, como representante legal de {name}, solicito una copia de los datos de salud que {provider} conserva sobre la visita de {name} del {date}: el informe de esa visita y los resultados, imágenes y documentos generados en ella."
      de: "Gemäß Artikel 15 der Verordnung (EU) 2016/679 (Datenschutz-Grundverordnung) und Artikel 18 des spanischen Gesetzes 41/2002 über die Patientenautonomie beantrage ich als gesetzliche Vertretung von {name} eine Kopie der Gesundheitsdaten, die {provider} über den Besuch von {name} am {date} speichert: den Bericht über diesen Besuch sowie die dabei entstandenen Ergebnisse, Bilder und Dokumente."
      fr: "En vertu de l'article 15 du règlement (UE) 2016/679 (règlement général sur la protection des données) et de l'article 18 de la loi espagnole 41/2002 sur l'autonomie du patient, en tant que représentant légal de {name}, je demande une copie des données de santé que {provider} détient sur la consultation de {name} du {date} : le compte rendu de cette consultation et les résultats, images et documents produits lors de celle-ci."
      ca: "A l'empara de l'article 15 del Reglament (UE) 2016/679 (Reglament general de protecció de dades) i de l'article 18 de la Llei 41/2002, bàsica reguladora de l'autonomia del pacient, com a representant legal de {name}, sol·licito una còpia de les dades de salut que {provider} conserva sobre la visita de {name} del {date}: l'informe d'aquella visita i els resultats, imatges i documents que s'hi van generar."
      it: "Ai sensi dell'articolo 15 del Regolamento (UE) 2016/679 (Regolamento generale sulla protezione dei dati) e dell'articolo 18 della legge spagnola 41/2002 sull'autonomia del paziente, in qualità di rappresentante legale di {name}, chiedo una copia dei dati sanitari che {provider} conserva sulla visita di {name} del {date}: il referto di quella visita e i risultati, le immagini e i documenti prodotti in essa."
      pt: "Ao abrigo do artigo 15.º do Regulamento (UE) 2016/679 (Regulamento Geral sobre a Proteção de Dados) e do artigo 18.º da Lei espanhola 41/2002 sobre a autonomia do doente, na qualidade de representante legal de {name}, solicito uma cópia dos dados de saúde que {provider} conserva sobre a consulta de {name} de {date}: o relatório dessa consulta e os resultados, imagens e documentos nela produzidos."
  eu:
    countries: [AT, BE, BG, CY, CZ, DE, DK, EE, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK, IS, LI, NO]
    laws:
      - id: gdpr_art15
        cite: https://eur-lex.europa.eu/eli/reg/2016/679/oj#art_15
        name:
          en: "Regulation (EU) 2016/679 (GDPR), Article 15"
          es: "Reglamento (UE) 2016/679 (RGPD), artículo 15"
          de: "Verordnung (EU) 2016/679 (DSGVO), Artikel 15"
          fr: "Règlement (UE) 2016/679 (RGPD), article 15"
          ca: "Reglament (UE) 2016/679 (RGPD), article 15"
          it: "Regolamento (UE) 2016/679 (GDPR), articolo 15"
          pt: "Regulamento (UE) 2016/679 (RGPD), artigo 15.º"
      - id: gdpr_art12
