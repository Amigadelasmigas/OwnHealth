        name:
          en: "Regulation (EU) 2016/679 (GDPR), Article 12(3)"
          es: "Reglamento (UE) 2016/679 (RGPD), artículo 12.3"
          de: "Verordnung (EU) 2016/679 (DSGVO), Artikel 12 Absatz 3"
          fr: "Règlement (UE) 2016/679 (RGPD), article 12, paragraphe 3"
          ca: "Reglament (UE) 2016/679 (RGPD), article 12.3"
          it: "Regolamento (UE) 2016/679 (GDPR), articolo 12, paragrafo 3"
          pt: "Regulamento (UE) 2016/679 (RGPD), artigo 12.º, n.º 3"
    basis:
      en: "Under Article 15 of Regulation (EU) 2016/679 (General Data Protection Regulation), I request a copy of the health data that {provider} holds about my visit on {date}: the report of that visit and the results, images and documents produced in it."
      es: "Al amparo del artículo 15 del Reglamento (UE) 2016/679 (Reglamento General de Protección de Datos), solicito una copia de los datos de salud que {provider} conserva sobre mi visita del {date}: el informe de esa visita y los resultados, imágenes y documentos generados en ella."
      de: "Gemäß Artikel 15 der Verordnung (EU) 2016/679 (Datenschutz-Grundverordnung) beantrage ich eine Kopie der Gesundheitsdaten, die {provider} über meinen Besuch am {date} speichert: den Bericht über diesen Besuch sowie die dabei entstandenen Ergebnisse, Bilder und Dokumente."
      fr: "En vertu de l'article 15 du règlement (UE) 2016/679 (règlement général sur la protection des données), je demande une copie des données de santé que {provider} détient sur ma consultation du {date} : le compte rendu de cette consultation et les résultats, images et documents produits lors de celle-ci."
      ca: "A l'empara de l'article 15 del Reglament (UE) 2016/679 (Reglament general de protecció de dades), sol·licito una còpia de les dades de salut que {provider} conserva sobre la meva visita del {date}: l'informe d'aquella visita i els resultats, imatges i documents que s'hi van generar."
      it: "Ai sensi dell'articolo 15 del Regolamento (UE) 2016/679 (Regolamento generale sulla protezione dei dati), chiedo una copia dei dati sanitari che {provider} conserva sulla mia visita del {date}: il referto di quella visita e i risultati, le immagini e i documenti prodotti in essa."
      pt: "Ao abrigo do artigo 15.º do Regulamento (UE) 2016/679 (Regulamento Geral sobre a Proteção de Dados), solicito uma cópia dos dados de saúde que {provider} conserva sobre a minha consulta de {date}: o relatório dessa consulta e os resultados, imagens e documentos nela produzidos."
    basis_for:
      en: "Under Article 15 of Regulation (EU) 2016/679 (General Data Protection Regulation), as the legal representative of {name}, I request a copy of the health data that {provider} holds about the visit of {name} on {date}: the report of that visit and the results, images and documents produced in it."
      es: "Al amparo del artículo 15 del Reglamento (UE) 2016/679 (Reglamento General de Protección de Datos), como representante legal de {name}, solicito una copia de los datos de salud que {provider} conserva sobre la visita de {name} del {date}: el informe de esa visita y los resultados, imágenes y documentos generados en ella."
      de: "Gemäß Artikel 15 der Verordnung (EU) 2016/679 (Datenschutz-Grundverordnung) beantrage ich als gesetzliche Vertretung von {name} eine Kopie der Gesundheitsdaten, die {provider} über den Besuch von {name} am {date} speichert: den Bericht über diesen Besuch sowie die dabei entstandenen Ergebnisse, Bilder und Dokumente."
      fr: "En vertu de l'article 15 du règlement (UE) 2016/679 (règlement général sur la protection des données), en tant que représentant légal de {name}, je demande une copie des données de santé que {provider} détient sur la consultation de {name} du {date} : le compte rendu de cette consultation et les résultats, images et documents produits lors de celle-ci."
      ca: "A l'empara de l'article 15 del Reglament (UE) 2016/679 (Reglament general de protecció de dades), com a representant legal de {name}, sol·licito una còpia de les dades de salut que {provider} conserva sobre la visita de {name} del {date}: l'informe d'aquella visita i els resultats, imatges i documents que s'hi van generar."
