# Family patterns: what the person's own family history shows that a guideline names. Evaluated on
# read into ownhealth.family/v1 (server/crates/ownhealth-rules/src/family.rs); never stored.
#
# A rule fires when any of its clauses matches. A clause looks only at the condition `kind` picked
# from data/family/conditions.yaml, never at free text: a condition written as "other" never counts.
#
# id            stable rule id; the status names it, the templates below give its words
# source        a short citation label (the same in every language) of the guideline the rule reads
# basis         guideline (the guideline names the pattern) or pack_default (our own reading of it)
# any           the clauses, each:
#   relationships  HL7 RoleCodes that count (absent: every blood relative within `degree`)
#   degree         the blood degrees that count (absent: 1 and 2)
#   kinds          the condition kinds that count; `same_kind` instead counts every kind but other
#   sex            only relatives of this sex
#   before         onset age below which a condition counts, by the relative's sex; a relative of
#                  unknown sex needs the lower of the two
#   count          how many distinct relatives must match (default 1)
#   same_side      the count must be reached on one side; a full sibling, a child or a grandchild
#                  counts on both, and a half-sibling, a parent of unknown side (PRN), a niece or a
#                  nephew on neither, because their side is not known
version: 0.1.0
rows:
  - id: fam.ascvd
    source: "ACC/AHA 2026 dyslipidemia, Table 13"
    basis: guideline
    cite: "https://doi.org/10.1161/CIR.0000000000001423"
    any:
      - {relationships: [FTH, MTH, PRN, BRO, SIS, SIB], kinds: [mi, cad, stroke], before: {male: 55, female: 65}}
  - id: fam.crc
    source: "USMSTF 2017"
    basis: guideline
    cite: "https://doi.org/10.1053/j.gastro.2017.05.013"
    any:
      - {degree: [1], kinds: [cancer_colon], before: {male: 60, female: 60}}
      - {degree: [1], kinds: [cancer_colon], count: 2}
  - id: fam.hboc
    source: "USPSTF 2019, BRCA"
    basis: guideline
    cite: "https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/brca-related-cancer-risk-assessment-genetic-counseling-and-genetic-testing"
    any:
      - {kinds: [cancer_breast], before: {male: 50, female: 50}}
      - {kinds: [cancer_breast], sex: male}
      - {kinds: [cancer_ovary]}
      # pancreatic and prostate cancer are outside the scope of this recommendation, so they never count
      - {kinds: [cancer_breast, cancer_ovary], count: 2, same_side: true}
  - id: fam.variant
    source: "CDC, BRCA risk factors"
    # the kind names no gene and the page names only BRCA, so the rule is our own reading of it
    basis: pack_default
    cite: "https://www.cdc.gov/breast-ovarian-cancer-hereditary/risk-factors/index.html"
    any:
      - {degree: [1, 2, 3], kinds: [hereditary_variant]}
  - id: fam.same_side
    source: "CDC, Prev Chronic Dis 2010"
    basis: pack_default
    cite: "https://www.cdc.gov/pcd/issues/2010/Jan/08_0221a.htm"
    any:
      - {same_kind: true, count: 2, same_side: true}
templates:
  title:
    fam.ascvd:
      en: "Heart or artery disease at a young age in a parent or sibling"
      es: "Enfermedad del corazón o de las arterias a edad temprana en un padre, una madre o un hermano"
      de: "Herz- oder Gefäßerkrankung in jungen Jahren bei einem Elternteil oder Geschwister"
    fam.crc:
      en: "Colon cancer in a first-degree relative before 60, or in two of them"
      es: "Cáncer de colon en un familiar de primer grado antes de los 60, o en dos de ellos"
      de: "Darmkrebs bei einem Verwandten ersten Grades vor 60 oder bei zweien von ihnen"
    fam.hboc:
      en: "Breast or ovarian cancers in the family"
      es: "Cánceres de mama u ovario en la familia"
      de: "Brust- oder Eierstockkrebs in der Familie"
    fam.variant:
      en: "A gene variant known in a blood relative"
      es: "Una variante genética conocida en un familiar de sangre"
      de: "Eine bekannte Genvariante bei einem Blutsverwandten"
    fam.same_side:
      en: "The same condition in two or more relatives on one side"
      es: "La misma enfermedad en dos o más familiares del mismo lado"
      de: "Dieselbe Erkrankung bei zwei oder mehr Angehörigen auf einer Seite"
  why:
    fam.ascvd:
      en: "The guideline lists a parent or sibling with heart or artery disease before 55 (men) or 65 (women) as a risk-enhancing factor."
      es: "La guía incluye a un padre, una madre o un hermano con enfermedad del corazón o de las arterias antes de los 55 (hombres) o los 65 (mujeres) como factor que aumenta el riesgo."
      de: "Die Leitlinie führt einen Elternteil oder ein Geschwister mit Herz- oder Gefäßerkrankung vor 55 (Männer) oder 65 (Frauen) als risikoerhöhenden Faktor auf."
    fam.crc:
      en: "The guideline names colon cancer in a first-degree relative before 60, or in two first-degree relatives at any age, as a family history that changes when screening starts."
      es: "La guía cita el cáncer de colon en un familiar de primer grado antes de los 60, o en dos familiares de primer grado a cualquier edad, como un antecedente que cambia cuándo empieza el cribado."
      de: "Die Leitlinie nennt Darmkrebs bei einem Verwandten ersten Grades vor 60 oder bei zwei Verwandten ersten Grades in jedem Alter als Familienanamnese, die den Beginn der Vorsorge verändert."
    fam.hboc:
      en: "The guideline lists breast cancer before 50, breast cancer in a man, ovarian cancer, or several of these cancers on one side as family history linked to BRCA1 and BRCA2."
      es: "La guía incluye el cáncer de mama antes de los 50, el cáncer de mama en un hombre, el cáncer de ovario o varios de estos cánceres en un mismo lado como antecedentes ligados a BRCA1 y BRCA2."
      de: "Die Leitlinie führt Brustkrebs vor 50, Brustkrebs bei einem Mann, Eierstockkrebs oder mehrere dieser Krebsarten auf einer Seite als Familienanamnese mit Bezug zu BRCA1 und BRCA2 auf."
    fam.variant:
      en: "Our own reading of family history guidance: a known hereditary gene variant in a blood relative is worth knowing about. The CDC lists a relative with a known BRCA gene mutation as a risk factor."
      es: "Nuestra lectura de las guías de antecedentes familiares: una variante genética hereditaria conocida en un familiar de sangre es un dato que conviene conocer. Los CDC incluyen a un familiar con una mutación conocida en un gen BRCA como factor de riesgo."
      de: "Unsere eigene Lesart der Leitlinien zur Familienanamnese: Eine bekannte erbliche Genvariante bei einem Blutsverwandten ist wissenswert. Die CDC führen einen Angehörigen mit bekannter BRCA-Genmutation als Risikofaktor auf."
    fam.same_side:
      en: "Our own reading of family history guidance: the same condition in two or more close relatives on one side is a pattern worth knowing about."
      es: "Nuestra lectura de las guías de antecedentes familiares: la misma enfermedad en dos o más familiares cercanos de un mismo lado es un patrón que conviene conocer."
      de: "Unsere eigene Lesart der Leitlinien zur Familienanamnese: Dieselbe Erkrankung bei zwei oder mehr nahen Angehörigen auf einer Seite ist ein wissenswertes Muster."
  reasons:
    no_onset_age:
      en: "A relative has a matching condition with no age at onset, so this pattern cannot be checked."
      es: "Un familiar tiene una enfermedad que encaja pero sin edad de inicio, así que este patrón no se puede comprobar."
      de: "Ein Angehöriger hat eine passende Erkrankung ohne Erkrankungsalter, daher lässt sich dieses Muster nicht prüfen."
