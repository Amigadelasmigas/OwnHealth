    insulin_factor: {en: "Insulin was printed in pmol/L and read as µIU/mL with the factor 6.00 (Knopp 2019). With the other published factor, 6.945, this result would be about 14% lower.", es: "La insulina venía en pmol/L y se leyó en µUI/mL con el factor 6,00 (Knopp 2019). Con el otro factor publicado, 6,945, este resultado sería un 14 % más bajo.", de: "Insulin war in pmol/L angegeben und wurde mit dem Faktor 6,00 als µIU/mL gelesen (Knopp 2019). Mit dem anderen veröffentlichten Faktor, 6,945, läge dieses Ergebnis etwa 14 % niedriger.", fr: "L'insuline était exprimée en pmol/L et a été lue en µUI/mL avec le facteur 6,00 (Knopp 2019). Avec l'autre facteur publié, 6,945, ce résultat serait inférieur d'environ 14 %.", ca: "La insulina venia en pmol/L i es va llegir en µUI/mL amb el factor 6,00 (Knopp 2019). Amb l'altre factor publicat, 6,945, aquest resultat seria un 14 % més baix.", it: "L'insulina era espressa in pmol/L ed è stata letta in µUI/mL con il fattore 6,00 (Knopp 2019). Con l'altro fattore pubblicato, 6,945, questo risultato sarebbe circa il 14% più basso.", pt: "A insulina vinha em pmol/L e foi lida em µUI/mL com o fator 6,00 (Knopp 2019). Com o outro fator publicado, 6,945, este resultado seria cerca de 14 % mais baixo."}
    fib4_age_65: {en: "From age 65 the published lower cutoff is 2.0 instead of 1.3 (McPherson 2017).", es: "Desde los 65 años el punto de corte inferior publicado es 2,0 en lugar de 1,3 (McPherson 2017).", de: "Ab 65 Jahren liegt der veröffentlichte untere Grenzwert bei 2,0 statt 1,3 (McPherson 2017).", fr: "À partir de 65 ans, le seuil inférieur publié est de 2,0 au lieu de 1,3 (McPherson 2017).", ca: "Des dels 65 anys el punt de tall inferior publicat és 2,0 en lloc d'1,3 (McPherson 2017).", it: "Dai 65 anni il cut-off inferiore pubblicato è 2,0 invece di 1,3 (McPherson 2017).", pt: "A partir dos 65 anos, o ponto de corte inferior publicado é 2,0 em vez de 1,3 (McPherson 2017)."}
    prevent_us_cohorts: {en: "PREVENT was developed and validated in adults in the United States.", es: "PREVENT se desarrolló y validó en adultos de Estados Unidos.", de: "PREVENT wurde bei Erwachsenen in den Vereinigten Staaten entwickelt und validiert.", fr: "PREVENT a été développé et validé chez des adultes aux États-Unis.", ca: "PREVENT es va desenvolupar i validar en adults dels Estats Units.", it: "PREVENT è stato sviluppato e validato su adulti negli Stati Uniti.", pt: "O PREVENT foi desenvolvido e validado em adultos dos Estados Unidos."}
    sbp_from_wearable: {en: "No office blood pressure in the 12 months before; the systolic pressure is the 30-day mean of wearable readings.", es: "No hay presión arterial de consulta en los 12 meses previos; la sistólica es la media de 30 días de las lecturas del wearable.", de: "Kein in der Praxis gemessener Blutdruck in den 12 Monaten davor; der systolische Wert ist der 30-Tage-Mittelwert der Wearable-Messungen.", fr: "Aucune pression artérielle mesurée en consultation dans les 12 mois précédents ; la systolique est la moyenne sur 30 jours des mesures de l'objet connecté.", ca: "No hi ha pressió arterial de consulta en els 12 mesos previs; la sistòlica és la mitjana de 30 dies de les lectures del wearable.", it: "Nessuna pressione arteriosa misurata in ambulatorio nei 12 mesi precedenti; la sistolica è la media di 30 giorni delle letture del dispositivo indossabile.", pt: "Não há pressão arterial de consulta nos 12 meses anteriores; a sistólica é a média de 30 dias das leituras do wearable."}
