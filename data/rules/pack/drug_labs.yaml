# Labs a prescriber looks at for a drug (genomics.md section 8, step 5). Latest value, date, the lab's own
# flag and the status word, Stale when outside the recency window of its body system. Each reason is
# written in English and Spanish; check_drug picks the request's language.
cite_default: https://github.com/GeiserX/OwnHealth/blob/main/docs/design/genomics.md#8-check_drug-pgx-joined-with-meds-and-labs
drug_labs:
  atorvastatin: &statin
    - {lab: alt, reason: {en: liver enzymes in the statin label, es: enzimas hepáticas en la ficha de la estatina, de: "Leberenzyme in der Fachinformation des Statins", fr: "enzymes hépatiques dans le RCP de la statine", ca: "enzims hepàtics a la fitxa de l'estatina"}}
    - {lab: ck, reason: {en: muscle enzyme in the statin label, es: enzima muscular en la ficha de la estatina, de: "Muskelenzym in der Fachinformation des Statins", fr: "enzyme musculaire dans le RCP de la statine", ca: "enzim muscular a la fitxa de l'estatina"}}
    - {lab: ldl_c, reason: {en: treatment target, es: objetivo del tratamiento, de: "Therapieziel", fr: "objectif thérapeutique", ca: "objectiu del tractament"}}
  simvastatin: *statin
  rosuvastatin: *statin
  pravastatin: *statin
  clopidogrel:
    - {lab: platelets, reason: {en: antiplatelet therapy, es: tratamiento antiagregante, de: "Thrombozytenaggregationshemmung", fr: "traitement antiplaquettaire", ca: "tractament antiagregant"}}
    - {lab: hemoglobin, reason: {en: bleeding risk, es: riesgo de sangrado, de: "Blutungsrisiko", fr: "risque hémorragique", ca: "risc de sagnat"}}
    - {lab: egfr, reason: {en: kidney function, es: función renal, de: "Nierenfunktion", fr: "fonction rénale", ca: "funció renal"}}
    - {lab: alt, reason: {en: liver function, es: función hepática, de: "Leberfunktion", fr: "fonction hépatique", ca: "funció hepàtica"}}
  warfarin:
    - {lab: inr, reason: {en: anticoagulation monitoring, es: control de la anticoagulación, de: "Überwachung der Antikoagulation", fr: "surveillance de l'anticoagulation", ca: "control de l'anticoagulació"}}
    - {lab: hemoglobin, reason: {en: bleeding risk, es: riesgo de sangrado, de: "Blutungsrisiko", fr: "risque hémorragique", ca: "risc de sagnat"}}
    - {lab: platelets, reason: {en: bleeding risk, es: riesgo de sangrado, de: "Blutungsrisiko", fr: "risque hémorragique", ca: "risc de sagnat"}}
  codeine: &opioid
    - {lab: egfr, reason: {en: kidney function, es: función renal, de: "Nierenfunktion", fr: "fonction rénale", ca: "funció renal"}}
    - {lab: alt, reason: {en: liver function, es: función hepática, de: "Leberfunktion", fr: "fonction hépatique", ca: "funció hepàtica"}}
  tramadol: *opioid
  azathioprine: &thiopurine
    - {lab: wbc, reason: {en: blood count in the thiopurine label, es: hemograma en la ficha de la tiopurina, de: "Blutbild in der Fachinformation des Thiopurins", fr: "hémogramme dans le RCP de la thiopurine", ca: "hemograma a la fitxa de la tiopurina"}}
    - {lab: platelets, reason: {en: blood count in the thiopurine label, es: hemograma en la ficha de la tiopurina, de: "Blutbild in der Fachinformation des Thiopurins", fr: "hémogramme dans le RCP de la thiopurine", ca: "hemograma a la fitxa de la tiopurina"}}
    - {lab: hemoglobin, reason: {en: blood count in the thiopurine label, es: hemograma en la ficha de la tiopurina, de: "Blutbild in der Fachinformation des Thiopurins", fr: "hémogramme dans le RCP de la thiopurine", ca: "hemograma a la fitxa de la tiopurina"}}
    - {lab: alt, reason: {en: liver function, es: función hepática, de: "Leberfunktion", fr: "fonction hépatique", ca: "funció hepàtica"}}
  mercaptopurine: *thiopurine
  thioguanine: *thiopurine
  fluorouracil: &fluoropyrimidine
    - {lab: wbc, reason: {en: blood count, es: hemograma, de: "Blutbild", fr: "hémogramme", ca: "hemograma"}}
    - {lab: platelets, reason: {en: blood count, es: hemograma, de: "Blutbild", fr: "hémogramme", ca: "hemograma"}}
    - {lab: egfr, reason: {en: kidney function, es: función renal, de: "Nierenfunktion", fr: "fonction rénale", ca: "funció renal"}}
  capecitabine: *fluoropyrimidine
  tacrolimus:
    - {lab: creatinine, reason: {en: kidney function, es: función renal, de: "Nierenfunktion", fr: "fonction rénale", ca: "funció renal"}}
    - {lab: egfr, reason: {en: kidney function, es: función renal, de: "Nierenfunktion", fr: "fonction rénale", ca: "funció renal"}}
  omeprazole: &ppi
    - {lab: vitamin_b12, reason: {en: long-term use in the PPI label, es: uso prolongado en la ficha del IBP, de: "Langzeitanwendung in der Fachinformation des PPI", fr: "usage prolongé dans le RCP de l'IPP", ca: "ús prolongat a la fitxa de l'IBP"}}
    - {lab: magnesium, reason: {en: long-term use in the PPI label, es: uso prolongado en la ficha del IBP, de: "Langzeitanwendung in der Fachinformation des PPI", fr: "usage prolongé dans le RCP de l'IPP", ca: "ús prolongat a la fitxa de l'IBP"}}
  pantoprazole: *ppi
  lansoprazole: *ppi
  citalopram: &ssri
    - {lab: sodium, reason: {en: hyponatraemia in the SSRI label, es: hiponatremia en la ficha del ISRS, de: "Hyponatriämie in der Fachinformation des SSRI", fr: "hyponatrémie dans le RCP de l'ISRS", ca: "hiponatrèmia a la fitxa de l'ISRS"}}
  escitalopram: *ssri
  sertraline: *ssri
  paroxetine: *ssri
