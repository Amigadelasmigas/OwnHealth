# Text templates, rendered after hashing. Information, never advice: no "you should", "take", "stop",
# "avoid" in our own words (tests/state/test_wording.py lints every rendered string). CPIC text is
# quoted verbatim in check_drug and is the only exception, always attributed.
templates:
  status.ok:            {en: In range, es: En rango, de: "Im Bereich", fr: "Dans la plage"}
  status.watch:         {en: Borderline, es: Límite, de: "Grenzwertig", fr: "Limite"}
  status.out:           {en: Out of range, es: Fuera de rango, de: "Außerhalb des Bereichs", fr: "Hors plage"}
  status.stale:         {en: Stale, es: Desactualizado, de: "Veraltet", fr: "Pas à jour"}
  status.nodata:        {en: No data, es: Sin datos, de: "Keine Daten", fr: "Pas de données"}
  LAB_HIGH:
    en: "{name} {value} {unit} (H, lab range {ref}) {when}."
    es: "{name} {value} {unit} (H, rango lab. {ref}) {when}."
    de: "{name} {value} {unit} (H, Laborbereich {ref}) {when}."
    fr: "{name} {value} {unit} (H, plage du labo {ref}) {when}."
  LAB_LOW:
    en: "{name} {value} {unit} (L, lab range {ref}) {when}."
    es: "{name} {value} {unit} (L, rango lab. {ref}) {when}."
    de: "{name} {value} {unit} (L, Laborbereich {ref}) {when}."
    fr: "{name} {value} {unit} (L, plage du labo {ref}) {when}."
  LAB_ABNORMAL:
    en: "{name} {value} {unit} flagged {flag} by the lab {when}."
    es: "{name} {value} {unit} marcado {flag} por el laboratorio {when}."
    de: "{name} {value} {unit}, vom Labor als {flag} markiert {when}."
    fr: "{name} {value} {unit} signalé {flag} par le laboratoire {when}."
  RCV_CHANGE:
    en: "{name} went from {prev} to {value} {unit} ({change_pct}%) since {prev_date}, more than the reference change value of {rcv_pct}%."
    es: "{name} pasó de {prev} a {value} {unit} ({change_pct} %) desde el {prev_date}, más que el valor de referencia del cambio ({rcv_pct} %)."
    de: "{name} ging seit dem {prev_date} von {prev} auf {value} {unit} ({change_pct} %), mehr als der Referenzänderungswert von {rcv_pct} %."
    fr: "{name} est passé de {prev} à {value} {unit} ({change_pct} %) depuis le {prev_date}, plus que la valeur de référence du changement de {rcv_pct} %."
  BASELINE_OUT:
    en: "{name} {value} {unit} {when} is outside this person's usual level of {low} to {high} {unit}, set by the mean of {n} earlier results from the same lab and method."
    es: "{name} {value} {unit} {when} queda fuera de su nivel habitual, de {low} a {high} {unit}, según la media de {n} resultados anteriores del mismo laboratorio y método."
    de: "{name} {value} {unit} {when} liegt außerhalb des üblichen Niveaus dieser Person von {low} bis {high} {unit}, bestimmt aus dem Mittelwert von {n} früheren Ergebnissen desselben Labors und derselben Methode."
    fr: "{name} {value} {unit} {when} est hors du niveau habituel de cette personne, de {low} à {high} {unit}, fixé par la moyenne de {n} résultats antérieurs du même laboratoire et de la même méthode."
  TREND_UP:
    en: "{name} rose over the last {n} results ({slope} {unit} per year) to {value} {unit} {when}."
    es: "{name} subió en los últimos {n} resultados ({slope} {unit} al año) hasta {value} {unit} {when}."
    de: "{name} stieg über die letzten {n} Ergebnisse ({slope} {unit} pro Jahr) auf {value} {unit} {when}."
    fr: "{name} a augmenté sur les {n} derniers résultats ({slope} {unit} par an) jusqu'à {value} {unit} {when}."
  TREND_DOWN:
    en: "{name} fell over the last {n} results ({slope} {unit} per year) to {value} {unit} {when}."
    es: "{name} bajó en los últimos {n} resultados ({slope} {unit} al año) hasta {value} {unit} {when}."
    de: "{name} sank über die letzten {n} Ergebnisse ({slope} {unit} pro Jahr) auf {value} {unit} {when}."
    fr: "{name} a baissé sur les {n} derniers résultats ({slope} {unit} par an) jusqu'à {value} {unit} {when}."
  STALE:
    en: "{name}: last result {last}, older than the {window_months}-month window."
    es: "{name}: último resultado {last}, fuera de la ventana de {window_months} meses."
    de: "{name}: letztes Ergebnis {last}, älter als das Fenster von {window_months} Monaten."
    fr: "{name} : dernier résultat {last}, plus ancien que la fenêtre de {window_months} mois."
  NEVER_MEASURED:
    en: "{name}: no result on record (rule {rule})."
    es: "{name}: ningún resultado registrado (regla {rule})."
    de: "{name}: kein Ergebnis in der Akte (Regel {rule})."
    fr: "{name} : aucun résultat dans le dossier (règle {rule})."
  GENE_DRUG:
    en: "Current {drug} with {gene} {phenotype}: CPIC lists this pair as actionable. To discuss with your prescriber."
    es: "{drug} actual con {gene} {phenotype}: CPIC considera accionable esta combinación. Para comentar con quien lo prescribe."
    de: "Aktuell {drug} bei {gene} {phenotype}: CPIC führt diese Kombination als handlungsrelevant. Zur Besprechung mit der verordnenden Person."
    fr: "{drug} actuel avec {gene} {phenotype} : le CPIC considère cette paire comme exploitable. À discuter avec la personne qui le prescrit."
  GENE_LAB_NEVER:
    en: "{gene} finding linked to {name}; no {name} result on record (rule {rule})."
    es: "Hallazgo en {gene} ligado a {name}; ningún resultado de {name} registrado (regla {rule})."
    de: "Befund in {gene} mit Bezug zu {name}; kein Ergebnis für {name} in der Akte (Regel {rule})."
    fr: "Résultat dans {gene} lié à {name} ; aucun résultat de {name} dans le dossier (règle {rule})."
  GENE_LAB_STALE:
    en: "{gene} finding linked to {name}; last result {last}, older than {window_days} days (rule {rule})."
    es: "Hallazgo en {gene} ligado a {name}; último resultado {last}, de hace más de {window_days} días (regla {rule})."
    de: "Befund in {gene} mit Bezug zu {name}; letztes Ergebnis {last}, älter als {window_days} Tage (Regel {rule})."
    fr: "Résultat dans {gene} lié à {name} ; dernier résultat {last}, plus ancien que {window_days} jours (règle {rule})."
  notice:
    en: Information from your records, not a diagnosis.
    es: Información de tus registros, no un diagnóstico.
    de: "Informationen aus deinen Akten, keine Diagnose."
    fr: "Informations issues de vos dossiers, pas un diagnostic."
  FLAGS_USE_LAB_RANGE:
    en: Flags use each lab's own printed range.
    es: Los avisos usan el rango impreso por cada laboratorio.
    de: "Die Hinweise nutzen den gedruckten Bereich des jeweiligen Labors."
    fr: "Les alertes utilisent la plage imprimée par chaque laboratoire."
  GENOME_RESEARCH_GRADE:
    en: Genome findings are research-grade unless a clinical lab confirmed them.
    es: Los hallazgos genómicos son de investigación salvo que un laboratorio clínico los haya confirmado.
    de: "Genombefunde haben Forschungsqualität, sofern kein klinisches Labor sie bestätigt hat."
    fr: "Les résultats génomiques sont de qualité recherche, sauf confirmation par un laboratoire clinique."
  SENSITIVE_EXCLUDED:
    en: "{n} facts in sensitive categories are not part of this summary."
    es: "{n} datos de categorías sensibles no forman parte de este resumen."
    de: "{n} Angaben in sensiblen Kategorien sind nicht Teil dieser Zusammenfassung."
    fr: "{n} données de catégories sensibles ne font pas partie de ce résumé."
  on_date:
    en: "on {date}"
    es: "el {date}"
    de: "am {date}"
    fr: "le {date}"
  days_ago:
    en: "{n} days ago"
    es: "hace {n} días"
    de: "vor {n} Tagen"
    fr: "il y a {n} jours"
  days_ago.one:
    en: "{n} day ago"
    es: "hace {n} día"
    de: "vor {n} Tag"
    fr: "il y a {n} jour"
  # dashboard
  subtitle.lab:
    en: "latest lab {n} days ago"
    es: "última analítica hace {n} días"
    de: "letzte Laborwerte vor {n} Tagen"
    fr: "dernier bilan il y a {n} jours"
  subtitle.lab.one:
    en: "latest lab {n} day ago"
    es: "última analítica hace {n} día"
    de: "letzte Laborwerte vor {n} Tag"
    fr: "dernier bilan il y a {n} jour"
  subtitle.wearables:
    en: "wearables synced {n} days ago"
    es: "wearables sincronizados hace {n} días"
    de: "Wearables vor {n} Tagen synchronisiert"
    fr: "objets connectés synchronisés il y a {n} jours"
  subtitle.wearables.one:
    en: "wearables synced {n} day ago"
    es: "wearables sincronizados hace {n} día"
    de: "Wearables vor {n} Tag synchronisiert"
    fr: "objets connectés synchronisés il y a {n} jour"
  sex.female:           {en: Female, es: Mujer, de: "Weiblich", fr: "Femme"}
  sex.male:             {en: Male, es: Hombre, de: "Männlich", fr: "Homme"}
  due.stale:
    en: "overdue · rule {rule} ({window_months} months)"
    es: "pendiente · regla {rule} ({window_months} meses)"
    de: "überfällig · Regel {rule} ({window_months} Monate)"
    fr: "en retard · règle {rule} ({window_months} mois)"
  due.never:
    en: "never measured · rule {rule}"
    es: "nunca medido · regla {rule}"
    de: "nie gemessen · Regel {rule}"
    fr: "jamais mesuré · règle {rule}"
  due.retest:
    en: "{name} retest"
    es: "Control de {name}"
    de: "Kontrolle von {name}"
    fr: "Contrôle de {name}"
  # the genome summary is three counts joined with " · "; `.one` is the singular
  genome.summary.pgx:
    en: "{n} actionable PGx"
    es: "{n} PGx accionables"
    de: "{n} handlungsrelevante PGx"
    fr: "{n} PGx exploitables"
  genome.summary.pgx.one:
    en: "{n} actionable PGx"
    es: "{n} PGx accionable"
    de: "{n} handlungsrelevante PGx"
    fr: "{n} PGx exploitable"
  genome.summary.carrier:
    en: "{n} carrier findings"
    es: "{n} hallazgos de portador"
    de: "{n} Trägerbefunde"
    fr: "{n} résultats de porteur"
  genome.summary.carrier.one:
    en: "{n} carrier finding"
    es: "{n} hallazgo de portador"
    de: "{n} Trägerbefund"
    fr: "{n} résultat de porteur"
  genome.summary.hidden:
    en: "{n} sensitive hidden"
    es: "{n} sensibles ocultos"
    de: "{n} sensible verborgen"
    fr: "{n} sensibles masqués"
  genome.summary.hidden.one:
    en: "{n} sensitive hidden"
    es: "{n} sensible oculto"
    de: "{n} sensibler verborgen"
    fr: "{n} sensible masqué"
  pgx.badge:
    en: "{gene} {phenotype} · CPIC {level} · to discuss with your prescriber"
    es: "{gene} {phenotype} · CPIC {level} · para comentar con quien lo prescribe"
    de: "{gene} {phenotype} · CPIC {level} · zur Besprechung mit der verordnenden Person"
    fr: "{gene} {phenotype} · CPIC {level} · à discuter avec la personne qui le prescrit"
  # check_drug
  drug.notice:
    en: Information from your records, not medical advice. To discuss with your prescriber.
    es: Información de tus registros, no un consejo médico. Para comentar con quien lo prescribe.
    de: "Informationen aus deinen Akten, kein medizinischer Rat. Zur Besprechung mit der verordnenden Person."
    fr: "Informations issues de vos dossiers, pas un avis médical. À discuter avec la personne qui le prescrit."
  drug.applies.genotype:
    en: "{phenotype} (genotype)"
    es: "{phenotype} (genotipo)"
    de: "{phenotype} (Genotyp)"
    fr: "{phenotype} (génotype)"
  drug.applies.functional:
    en: "{phenotype} (functional, via phenoconversion)"
    es: "{phenotype} (funcional, por fenoconversión)"
    de: "{phenotype} (funktionell, durch Phänokonversion)"
    fr: "{phenotype} (fonctionnel, par phénoconversion)"
  drug.pheno.computed:
    en: "{by} is a {strength} CYP2D6 inhibitor: activity score {score} becomes {score_functional}, {functional_phenotype} (functional). The genotype phenotype stays {phenotype}."
    es: "{by} es un inhibidor {strength} de CYP2D6: la puntuación de actividad {score} pasa a {score_functional}, {functional_phenotype} (funcional). El fenotipo por genotipo sigue siendo {phenotype}."
    de: "{by} ist ein CYP2D6-Hemmer (Stärke: {strength}): Aktivitätswert {score} wird zu {score_functional}, {functional_phenotype} (funktionell). Der Genotyp-Phänotyp bleibt {phenotype}."
    fr: "{by} est un inhibiteur {strength} du CYP2D6 : le score d'activité {score} devient {score_functional}, {functional_phenotype} (fonctionnel). Le phénotype par génotype reste {phenotype}."
  drug.pheno.no_score:
    en: "{by} is a {strength} CYP2D6 inhibitor. The finding has no activity score, so the effect is not computed."
    es: "{by} es un inhibidor {strength} de CYP2D6. El hallazgo no trae puntuación de actividad, así que el efecto no se calcula."
    de: "{by} ist ein CYP2D6-Hemmer (Stärke: {strength}). Der Befund hat keinen Aktivitätswert, daher wird die Wirkung nicht berechnet."
    fr: "{by} est un inhibiteur {strength} du CYP2D6. Le résultat n'a pas de score d'activité, l'effet n'est donc pas calculé."
  drug.pheno.not_computed:
    en: "{by} is a {strength} {gene} inhibitor. CPIC publishes no conversion rule for {gene}, so the effect on the phenotype is not computed; the genotype phenotype stays as called."
    es: "{by} es un inhibidor {strength} de {gene}. CPIC no publica una regla de conversión para {gene}, así que el efecto sobre el fenotipo no se calcula; el fenotipo por genotipo se mantiene."
    de: "{by} ist ein {gene}-Hemmer (Stärke: {strength}). CPIC veröffentlicht keine Umrechnungsregel für {gene}, daher wird die Wirkung auf den Phänotyp nicht berechnet; der Genotyp-Phänotyp bleibt wie bestimmt."
    fr: "{by} est un inhibiteur {strength} de {gene}. Le CPIC ne publie aucune règle de conversion pour {gene}, l'effet sur le phénotype n'est donc pas calculé ; le phénotype par génotype reste tel qu'appelé."
  strength.strong:      {en: strong, es: potente, de: "stark", fr: "fort"}
  strength.moderate:    {en: moderate, es: moderado, de: "mäßig", fr: "modéré"}
  drug.relation.same:   {en: this drug, es: este fármaco, de: "dieses Arzneimittel", fr: "ce médicament"}
  drug.relation.inhibitor:
    en: "{gene} inhibitor ({strength})"
    es: "inhibidor de {gene} ({strength})"
    de: "{gene}-Hemmer ({strength})"
    fr: "inhibiteur de {gene} ({strength})"
  drug.relation.not_assessed: {en: Not assessed, es: No evaluado, de: "Nicht untersucht", fr: "Non évalué"}
  drug.na.ddi:
    en: drug-drug interactions (no open-licence source configured)
    es: interacciones entre fármacos (sin fuente de licencia abierta configurada)
    de: "Arzneimittelwechselwirkungen (keine Quelle mit offener Lizenz eingerichtet)"
    fr: "interactions médicamenteuses (aucune source sous licence ouverte configurée)"
  drug.na.no_pair:
    en: "no CPIC level A gene pair for {drug} in the bundled table"
    es: "ningún par gen-fármaco de nivel A de CPIC para {drug} en la tabla incluida"
    de: "kein CPIC-Genpaar der Stufe A für {drug} in der mitgelieferten Tabelle"
    fr: "aucune paire gène-médicament de niveau A du CPIC pour {drug} dans la table fournie"
  drug.na.gene:
    en: "{gene}: no genome finding on record"
    es: "{gene}: ningún hallazgo genómico registrado"
    de: "{gene}: kein Genombefund in der Akte"
    fr: "{gene} : aucun résultat génomique dans le dossier"
  drug.na.no_rec:
    en: "{gene}: no CPIC recommendation text in the snapshot matches {phenotype}"
    es: "{gene}: ningún texto de recomendación de CPIC en la instantánea corresponde a {phenotype}"
    de: "{gene}: kein CPIC-Empfehlungstext im Snapshot passt zu {phenotype}"
    fr: "{gene} : aucun texte de recommandation du CPIC dans l'instantané ne correspond à {phenotype}"
  drug.na.warfarin:
    en: CPIC gives warfarin dosing as an algorithm, not as text per phenotype; the bundled snapshot quotes none
    es: CPIC da la dosis de warfarina como un algoritmo, no como texto por fenotipo; la instantánea incluida no cita ninguno
    de: "CPIC gibt die Warfarin-Dosierung als Algorithmus an, nicht als Text je Phänotyp; der mitgelieferte Snapshot zitiert keinen"
    fr: "Le CPIC donne la posologie de la warfarine sous forme d'algorithme, non de texte par phénotype ; l'instantané fourni n'en cite aucun"
  drug.lim.phenoconversion:
    en: Phenoconversion is derived from the medication list as recorded; CPIC tables are written for genotype.
    es: La fenoconversión se deriva de la lista de medicación registrada; las tablas de CPIC se escriben para el genotipo.
    de: "Die Phänokonversion wird aus der erfassten Medikamentenliste abgeleitet; die CPIC-Tabellen sind für den Genotyp geschrieben."
    fr: "La phénoconversion est déduite de la liste de médicaments telle qu'enregistrée ; les tables du CPIC sont écrites pour le génotype."
  drug.lim.snapshot:
    en: "Guidance is quoted verbatim from the CPIC snapshot of {date} (CC0)."
    es: "Las recomendaciones se citan literalmente de la instantánea de CPIC del {date} (CC0)."
    de: "Die Empfehlungen werden wörtlich aus dem CPIC-Snapshot vom {date} zitiert (CC0)."
    fr: "Les recommandations sont citées mot pour mot depuis l'instantané du CPIC du {date} (CC0)."
  drug.lim.indication:
    en: The indication decides which recommendation applies; the record does not hold it, so every matching population is shown.
    es: La indicación decide qué recomendación aplica; el registro no la recoge, así que se muestran todas las poblaciones que coinciden.
    de: "Welche Empfehlung gilt, hängt von der Indikation ab; die Akte enthält sie nicht, daher werden alle passenden Gruppen gezeigt."
    fr: "L'indication détermine quelle recommandation s'applique ; le dossier ne la contient pas, toutes les populations correspondantes sont donc affichées."
